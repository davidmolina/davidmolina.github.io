<footer class="site-footer">

  <div class="wrapper">

    <div class="footer-bottom">
      <div class="footer-bottom-primary">
        <h2 class="footer-heading">{{ site.title }}</h2>
        <p>{{ site.description }}</p>
        <p class="footer-copyright">&copy; 2026 David Molina</p>
      </div>

      <div class="footer-bottom-secondary">
        <p class="footer-links">
          <a href="{{ "/" | relative_url }}">davidcmolina.com</a>
          <a href="{{ "/about/" | relative_url }}">About</a>
          <a href="{{ "/writing/" | relative_url }}">Writing</a>
          <a href="{{ "/now/" | relative_url }}">Now</a>
          <a href="{{ "/book/" | relative_url }}">Book</a>
          <a href="{{ "/speaking/" | relative_url }}">Speaking</a>
          <a href="https://molinas.consulting/" target="_blank" rel="noopener noreferrer">Business Sales</a>
          <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
        </p>

        <section class="footer-share" aria-label="Social profiles and page link">
          <div class="footer-share-actions">
            <a class="post-share-link" href="https://www.linkedin.com/in/davidcmolina/" target="_blank" rel="noopener noreferrer" aria-label="David Molina on LinkedIn">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path>
                <rect x="2" y="9" width="4" height="12"></rect>
                <circle cx="4" cy="4" r="2"></circle>
              </svg>
              <span>LinkedIn</span>
            </a>
            <a class="post-share-link" href="https://www.instagram.com/davidcmolina/" target="_blank" rel="noopener noreferrer" aria-label="David Molina on Instagram">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
              </svg>
              <span>Instagram</span>
            </a>
            <a class="post-share-link" href="https://www.facebook.com/david.molina1" target="_blank" rel="noopener noreferrer" aria-label="David Molina on Facebook">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M14 8h3V4h-3a5 5 0 0 0-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9a1 1 0 0 1 1-1z"></path>
              </svg>
              <span>Facebook</span>
            </a>
            <a class="post-share-link" href="https://twitter.com/davidcmolina" target="_blank" rel="noopener noreferrer" aria-label="David Molina on X">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 4l11.73 16h4.27L8.27 4z"></path>
                <path d="M4 20l6.77-6.77"></path>
                <path d="M13.23 10.77L20 4"></path>
              </svg>
              <span>X</span>
            </a>
            <button class="post-share-link post-share-copy" type="button" data-share-url="{{ page.url | absolute_url }}" aria-label="Copy link">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.15"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.15-1.15"></path>
              </svg>
              <span>Copy link</span>
            </button>
          </div>
        </section>

        {% if site.subscribe_endpoint and site.subscribe_endpoint != "" %}
          <form class="subscribe-form" id="subscribe-form" data-endpoint="{{ site.subscribe_endpoint }}">
            <label class="subscribe-label" for="subscribe-email">Get new posts by email</label>
            <div class="subscribe-controls">
              <input id="subscribe-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
              <button type="submit">Subscribe</button>
            </div>
            <p class="subscribe-status" id="subscribe-status" aria-live="polite"></p>
          </form>
        {% endif %}

        <div class="footer-legal">
          <a href="#">Back to top ^</a>
        </div>
      </div>
    </div>

  </div>

</footer>
